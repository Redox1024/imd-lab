<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Edit content | IMD Lab</title><link rel="icon" href="assets/logos/imd-lab-mark.png" type="image/png"><link rel="stylesheet" href="styles.css?v=20260915-pi4"></head>
