name: Deploy lab website to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 2 * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh licensed Journal Impact Factors when configured
        env:
          CLARIVATE_API_KEY: ${{ secrets.CLARIVATE_API_KEY }}
          JCR_PUBLIC_DISPLAY_AUTHORIZED: ${{ vars.JCR_PUBLIC_DISPLAY_AUTHORIZED }}
        run: node scripts/refresh-jif.mjs
      - name: Validate content and JavaScript
        run: |
          node --check dist/app.js
          node --check dist/editor.js
          node --check dist/schema.js
          node --check dist/pagination.js
          node --check dist/live-preview.js
          node --check dist/publication-data.js
          node --check dist/document-import.js
          node --check scripts/refresh-jif.mjs
          node scripts/validate-content.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
